<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Support case workflow"><title>Support case workflow</title><g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="280" rx="20" fill="#111c31"/><text x="34" y="43" font-size="17" font-weight="700" fill="#b7b2ff">FROM A CUSTOMER QUESTION TO A REVIEWED RESPONSE</text><rect x="34" y="73" width="280" height="145" rx="12" fill="#1b2942" stroke="#3b4862"/><text x="52" y="110" fill="white" font-size="20" font-weight="700">Confirm the case</text><text x="52" y="151" fill="#bcc8dc" font-size="17">Exact device model</text><text x="52" y="180" fill="#bcc8dc" font-size="17">Relevant dates and context</text><text x="318" y="156" fill="#aba5ff" font-size="26">→</text><rect x="344" y="73" width="280" height="145" rx="12" fill="#1b2942" stroke="#3b4862"/><text x="362" y="110" fill="white" font-size="20" font-weight="700">Find applicable guidance</text><text x="362" y="151" fill="#bcc8dc" font-size="17">Ask the knowledge base</text><text x="362" y="180" fill="#bcc8dc" font-size="17">Retrieve source passages</text><text x="628" y="156" fill="#aba5ff" font-size="26">→</text><rect x="654" y="73" width="280" height="145" rx="12" fill="#1b2942" stroke="#3b4862"/><text x="672" y="110" fill="white" font-size="20" font-weight="700">Review the evidence</text><text x="672" y="151" fill="#bcc8dc" font-size="17">Check the proposed answer</text><text x="672" y="180" fill="#bcc8dc" font-size="17">Confirm source support</text><text x="938" y="156" fill="#aba5ff" font-size="26">→</text><rect x="964" y="73" width="280" height="145" rx="12" fill="#1b2942" stroke="#3b4862"/><text x="982" y="110" fill="white" font-size="20" font-weight="700">Respond or escalate</text><text x="982" y="151" fill="#bcc8dc" font-size="17">Agent advises the customer</text><text x="982" y="180" fill="#bcc8dc" font-size="17">Specialist reviews uncertainty</text><text x="34" y="253" fill="#a8b5cc" font-size="16">The workspace supports research and evidence review. The agent retains responsibility for the customer response.</text></g></svg>