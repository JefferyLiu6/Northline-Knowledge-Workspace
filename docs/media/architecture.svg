<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Knowledge preparation, evidence retrieval, and answer inspection with the local application architecture"><title>Knowledge preparation, evidence retrieval, and answer inspection with the local application architecture</title><g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="460" rx="20" fill="#f5f6fc"/><text x="36" y="45" font-size="18" fill="#6358d9" font-weight="700">HOW A QUESTION BECOMES AN INSPECTABLE ANSWER</text><rect x="36" y="80" width="360" height="135" rx="12" fill="white" stroke="#dce1ed"/><text x="58" y="116" font-size="23" fill="#17243a" font-weight="700">1. Prepare knowledge</text><text x="58" y="154" font-size="18" fill="#5e6c80" font-weight="400">Upload → parse → chunk</text><text x="58" y="182" font-size="18" fill="#5e6c80" font-weight="400">Embed with mxbai-embed-large</text><text x="417" y="157" font-size="30" fill="#6358d9" font-weight="400">→</text><rect x="460" y="80" width="360" height="135" rx="12" fill="white" stroke="#dce1ed"/><text x="482" y="116" font-size="23" fill="#17243a" font-weight="700">2. Retrieve evidence</text><text x="482" y="154" font-size="18" fill="#5e6c80" font-weight="400">Question → vector / BM25</text><text x="482" y="182" font-size="18" fill="#5e6c80" font-weight="400">Optional reranking</text><text x="841" y="157" font-size="30" fill="#6358d9" font-weight="400">→</text><rect x="884" y="80" width="360" height="135" rx="12" fill="white" stroke="#dce1ed"/><text x="906" y="116" font-size="23" fill="#17243a" font-weight="700">3. Generate + inspect</text><text x="906" y="154" font-size="18" fill="#5e6c80" font-weight="400">Ollama → answer</text><text x="906" y="182" font-size="18" fill="#5e6c80" font-weight="400">Open the source passages</text><text x="36" y="262" font-size="14" fill="#7a8597" font-weight="700">IMPLEMENTATION</text><rect x="36" y="284" width="270" height="92" rx="12" fill="#eae8fc"/><text x="54" y="318" font-size="21" fill="#413a8b" font-weight="700">Vue + FastAPI</text><text x="54" y="350" font-size="16" fill="#5e6c80" font-weight="400">Interface and orchestration</text><rect x="326" y="284" width="270" height="92" rx="12" fill="#eae8fc"/><text x="344" y="318" font-size="21" fill="#413a8b" font-weight="700">MySQL</text><text x="344" y="350" font-size="16" fill="#5e6c80" font-weight="400">Accounts, prompts, jobs, text</text><rect x="616" y="284" width="290" height="92" rx="12" fill="#eae8fc"/><text x="634" y="318" font-size="21" fill="#413a8b" font-weight="700">PostgreSQL + pgvector</text><text x="634" y="350" font-size="16" fill="#5e6c80" font-weight="400">Searchable embeddings</text><rect x="926" y="284" width="318" height="92" rx="12" fill="#eae8fc"/><text x="944" y="318" font-size="21" fill="#413a8b" font-weight="700">Host Ollama</text><text x="944" y="350" font-size="16" fill="#5e6c80" font-weight="400">Local generation and embeddings</text><text x="36" y="421" font-size="17" fill="#5e6c80" font-weight="400">Nginx serves the UI and /api · persistent Docker volumes · one backend worker per database</text></g></svg>