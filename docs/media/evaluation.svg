<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Development evaluation: vector 15 of 18, hybrid 17 of 18, hybrid with reranking 17 of 18, with measured retrieval latency"><title>Development evaluation: vector 15 of 18, hybrid 17 of 18, hybrid with reranking 17 of 18, with measured retrieval latency</title><g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="460" rx="20" fill="#f5f6fc" /><text x="36" y="46" font-size="18" fill="#6358d9" font-weight="700">WHAT THE DEVELOPMENT EVALUATION SHOWED</text><text x="36" y="84" font-size="18" fill="#5e6c80" font-weight="400">50 questions · 150 strategy comparisons · selected technical checks on 18 cases</text><text x="36" y="133" font-size="16" fill="#7a8597" font-weight="700">Strategy</text><text x="345" y="133" font-size="16" fill="#7a8597" font-weight="700">Technical fact checks passed</text><text x="1050" y="133" font-size="16" fill="#7a8597" font-weight="700">Median retrieval</text><text x="36" y="190" font-size="22" fill="#17243a" font-weight="600">Vector</text><rect x="345" y="167" width="515" height="30" rx="7" fill="#e1e5ef" /><rect x="345" y="167" width="429.17" height="30" rx="7" fill="#8e98ae" /><text x="895" y="190" font-size="25" fill="#17243a" font-weight="700">15/18</text><text x="1060" y="190" font-size="23" fill="#17243a" font-weight="600">0.09 s</text><text x="36" y="264" font-size="22" fill="#17243a" font-weight="600">Hybrid</text><rect x="345" y="241" width="515" height="30" rx="7" fill="#e1e5ef" /><rect x="345" y="241" width="486.39" height="30" rx="7" fill="#6358d9" /><text x="895" y="264" font-size="25" fill="#17243a" font-weight="700">17/18</text><text x="1060" y="264" font-size="23" fill="#17243a" font-weight="600">0.18 s</text><text x="36" y="338" font-size="22" fill="#17243a" font-weight="600">Hybrid + reranking</text><rect x="345" y="315" width="515" height="30" rx="7" fill="#e1e5ef" /><rect x="345" y="315" width="486.39" height="30" rx="7" fill="#6358d9" /><text x="895" y="338" font-size="25" fill="#17243a" font-weight="700">17/18</text><text x="1060" y="338" font-size="23" fill="#17243a" font-weight="600">7.62 s</text><text x="36" y="404" font-size="17" fill="#5e6c80" font-weight="400">Reranking uses the same five candidates; compare answer checks and latency before adding it.</text><text x="36" y="435" font-size="15" fill="#7a8597" font-weight="400">Local development run after the source refresh. These figures are not measured customer outcomes.</text></g></svg>